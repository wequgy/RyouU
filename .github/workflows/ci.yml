name: CI Suite Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Clean Install & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libgl1 libglib2.0-0

      - name: Install Suite Extras (Clean Clone)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[kyc,interview,postgres,dev]"

      - name: Check Undeclared Runtime Imports
        run: |
          python scripts/check_undeclared_imports.py

      - name: Run System Diagnostics & Model Preflight
        env:
          KYC_DEV_MODE: "1"
        run: |
          python -m scripts.preflight

      - name: Run Full Test Suite (including liveness tests)
        env:
          KYC_DEV_MODE: "1"
        run: |
          pytest -v --durations=10
