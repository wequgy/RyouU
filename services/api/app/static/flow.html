    /* ──────────── STEP 6A: Auto Eye-Blink Challenge (Full Bleed Camera) ──────────── */
    async function launchBlinkChallenge() {
      setStep(6);
      state.camMode = 'blink';
      state.blinksDetected = 0;

      const ok = await startCameraSession();
      if (!ok) return;

      $('cameraFullscreen').classList.remove('hidden');

      try {
        if (!state.challenges || state.challenges.length === 0) {
          const data = await api('POST', `/flow/${VID}/challenges`);
          state.challenges = data.challenges || [];
        }
      } catch (e) {
        console.warn('Challenge load error:', e);
      }

      // Configure Camera UI for Blink Challenge
      $('camHeadline').textContent = 'Blink your eyes naturally';
      $('camSubline').textContent = 'Look at the camera and blink 2 times naturally';
      $('camControlsRow').classList.add('hidden');
      $('blinkStatusRow').classList.remove('hidden');
      $('bp1').className = 'blink-pill';
      $('bp2').className = 'blink-pill';
      $('bp1').innerHTML = '<span class="bp-dot"></span> Blink 1';
      $('bp2').innerHTML = '<span class="bp-dot"></span> Blink 2';
      $('phraseGlassOverlay').classList.add('hidden');
      $('speakingDoneBtn').classList.add('hidden');

      // Start background challenge video recorder
      startChallengeVideoRecording();

      // Launch real-time client-side auto blink detector
      startClientSideAutoBlink();
    }

    function startChallengeVideoRecording() {
      state.videoChunks = [];
      if (typeof MediaRecorder !== 'undefined' && state.mainStream) {
        try {
          const vMime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
          state.videoRec = vMime ? new MediaRecorder(state.mainStream, { mimeType: vMime }) : new MediaRecorder(state.mainStream);
          state.videoRec.ondataavailable = e => { if (e.data.size > 0) state.videoChunks.push(e.data); };
          state.videoRec.start(200);
        } catch (ve) {
          console.warn('Video recorder warning:', ve);
        }
      }
    }

    function startClientSideAutoBlink() {
      const vid = $('fullCamVid');
      const canvas = $('camCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = 64;
      canvas.height = 64;

      let lastBlinkTime = 0;
      let blinkPhase = 0; // 0: tracking open eyes, 1: eyelid closing/closed
      let eyeClosedStart = 0;
      let baselineHistoryL = [];
      let baselineHistoryR = [];
      let baselineP10HistoryL = [];
      let baselineP10HistoryR = [];
      let prevForehead = null;
      let maxDepthReachedL = 0;
      let maxDepthReachedR = 0;
      const startTime = Date.now();

      function getROIRegions() {
        const vw = vid.videoWidth || 640;
        const vh = vid.videoHeight || 480;
        const cw = window.innerWidth || 360;
        const ch = window.innerHeight || 800;
        const hudEl = $('camHudFrame');
        const hud = hudEl ? hudEl.getBoundingClientRect() : null;

        let faceX, faceY, faceW, faceH;

        if (hud && hud.width > 40 && hud.height > 40) {
          const scale = Math.max(cw / vw, ch / vh);
          const renderedW = vw * scale;
          const renderedH = vh * scale;
          const offsetX = (cw - renderedW) / 2;
          const offsetY = (ch - renderedH) / 2;

          const unmirroredLeft = cw - (hud.left + hud.width);
          const screenTop = hud.top;

          faceX = Math.max(0, Math.min(vw - 20, (unmirroredLeft - offsetX) / scale));
          faceY = Math.max(0, Math.min(vh - 20, (screenTop - offsetY) / scale));
          faceW = Math.max(20, Math.min(vw - faceX, hud.width / scale));
          faceH = Math.max(20, Math.min(vh - faceY, hud.height / scale));
        } else {
          faceW = vw * 0.52;
          faceH = vh * 0.52;
          faceX = (vw - faceW) / 2;
          faceY = (vh - faceH) * 0.44;
        }

        // Forehead reference
        const fx = Math.floor(faceX + faceW * 0.22);
        const fy = Math.floor(faceY + faceH * 0.14);
        const fw = Math.floor(faceW * 0.56);
        const fh = Math.floor(faceH * 0.13);

        // Left Eye: 16% to 46% of face width
        const lx = Math.floor(faceX + faceW * 0.16);
        const ly = Math.floor(faceY + faceH * 0.36);
        const lw = Math.floor(faceW * 0.30);
        const lh = Math.floor(faceH * 0.18);

        // Right Eye: 54% to 84% of face width
        const rx = Math.floor(faceX + faceW * 0.54);
        const ry = Math.floor(faceY + faceH * 0.36);
        const rw = Math.floor(faceW * 0.30);
        const rh = Math.floor(faceH * 0.18);

        return {
          fx: Math.max(0, Math.min(vw - 1, fx)),
          fy: Math.max(0, Math.min(vh - 1, fy)),
          fw: Math.max(1, Math.min(vw - fx, fw)),
          fh: Math.max(1, Math.min(vh - fy, fh)),
          lx: Math.max(0, Math.min(vw - 1, lx)),
          ly: Math.max(0, Math.min(vh - 1, ly)),
          lw: Math.max(1, Math.min(vw - lx, lw)),
          lh: Math.max(1, Math.min(vh - ly, lh)),
          rx: Math.max(0, Math.min(vw - 1, rx)),
          ry: Math.max(0, Math.min(vh - 1, ry)),
          rw: Math.max(1, Math.min(vw - rx, rw)),
          rh: Math.max(1, Math.min(vh - ry, rh))
        };
      }

      function computePatchStats(imgData, startX, startY, width, height) {
        let sum = 0, sumSq = 0;
        const total = width * height;
        const vals = [];
        for (let y = startY; y < startY + height; y++) {
          for (let x = startX; x < startX + width; x++) {
            const idx = (y * 64 + x) * 4;
            const gray = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
            sum += gray;
            sumSq += gray * gray;
            vals.push(gray);
          }
        }
        const mean = sum / total;
        const variance = Math.max(0, (sumSq / total) - (mean * mean));
        const stdDev = Math.sqrt(variance);
        vals.sort((a, b) => a - b);
        const p10 = vals[Math.floor(total * 0.10)];
        return { mean, stdDev, p10 };
      }

      state.blinkTimer = setInterval(() => {
        if (!vid || vid.readyState < 2 || state.camMode !== 'blink') return;
        try {
          const now = Date.now();
          // Allow camera exposure, auto-focus and sensor to stabilize for 1.2s
          if (now - startTime < 1200) return;

          const roi = getROIRegions();

          // Draw forehead onto top 64x20
          ctx.drawImage(vid, roi.fx, roi.fy, roi.fw, roi.fh, 0, 0, 64, 20);
          // Draw left eye onto bottom-left 30x30
          ctx.drawImage(vid, roi.lx, roi.ly, roi.lw, roi.lh, 0, 24, 30, 30);
          // Draw right eye onto bottom-right 30x30
          ctx.drawImage(vid, roi.rx, roi.ry, roi.rw, roi.rh, 34, 24, 30, 30);

          const imgData = ctx.getImageData(0, 0, 64, 64).data;

          // Check forehead motion to reject violent head shakes
          let fMotion = 0;
          const fTotal = 64 * 20;
          for (let i = 0; i < fTotal; i++) {
            const pi = i * 4;
            const gray = (0.299 * imgData[pi] + 0.587 * imgData[pi+1] + 0.114 * imgData[pi+2]);
            if (prevForehead) fMotion += Math.abs(gray - prevForehead[i]);
          }
          const avgFMotion = prevForehead ? (fMotion / fTotal) : 0;
          if (!prevForehead) prevForehead = new Float32Array(fTotal);
          for (let i = 0; i < fTotal; i++) {
            const pi = i * 4;
            prevForehead[i] = (0.299 * imgData[pi] + 0.587 * imgData[pi+1] + 0.114 * imgData[pi+2]);
          }

          const statsL = computePatchStats(imgData, 0, 24, 30, 30);
          const statsR = computePatchStats(imgData, 34, 24, 30, 30);

          // Calibrate open-eye baseline over 12 steady frames
          if (baselineHistoryL.length < 12) {
            if (avgFMotion < 4.0) {
              baselineHistoryL.push(statsL.stdDev);
              baselineHistoryR.push(statsR.stdDev);
              baselineP10HistoryL.push(statsL.p10);
              baselineP10HistoryR.push(statsR.p10);
            }
            return;
          }

          const baseStdL = baselineHistoryL.reduce((a, b) => a + b, 0) / baselineHistoryL.length;
          const baseStdR = baselineHistoryR.reduce((a, b) => a + b, 0) / baselineHistoryR.length;
          const baseP10L = baselineP10HistoryL.reduce((a, b) => a + b, 0) / baselineP10HistoryL.length;
          const baseP10R = baselineP10HistoryR.reduce((a, b) => a + b, 0) / baselineP10HistoryR.length;

          // Slowly update baseline when head is still and eyes are open
          if (avgFMotion < 3.0 && blinkPhase === 0) {
            baselineHistoryL.shift(); baselineHistoryL.push(statsL.stdDev);
            baselineHistoryR.shift(); baselineHistoryR.push(statsR.stdDev);
            baselineP10HistoryL.shift(); baselineP10HistoryL.push(statsL.p10);
            baselineP10HistoryR.shift(); baselineP10HistoryR.push(statsR.p10);
          }

          // True physical signals of eyelid closure:
          // 1. Contrast drops significantly as eyelids cover high-contrast sclera/iris
          const dropL = (baseStdL > 4) ? (baseStdL - statsL.stdDev) / baseStdL : 0;
          const dropR = (baseStdR > 4) ? (baseStdR - statsR.stdDev) / baseStdR : 0;

          // 2. Pupil darkness disappears: the darkest 10% of pixels become skin-toned
          const pupilDeltaL = statsL.p10 - baseP10L;
          const pupilDeltaR = statsR.p10 - baseP10R;

          // Strict cooldown between consecutive blinks (at least 600ms)
          if (now - lastBlinkTime < 600) {
            blinkPhase = 0;
            return;
          }

          // Phase 0: Eyes are open. Detect genuine bilateral eyelid closure.
          // Requires BOTH eyes to lose contrast (at least 20%) AND pupil darkness to lighten
          if (blinkPhase === 0) {
            const eyesClosing = (dropL >= 0.20 && dropR >= 0.20) &&
                                (pupilDeltaL >= 8 || pupilDeltaR >= 8) &&
                                (avgFMotion < 8.0);

            if (eyesClosing) {
              blinkPhase = 1;
              eyeClosedStart = now;
              maxDepthReachedL = dropL;
              maxDepthReachedR = dropR;
            }
          }
          // Phase 1: Eyes closed. Wait for confirmed bilateral reopening.
          else if (blinkPhase === 1) {
            const closedDuration = now - eyeClosedStart;
            maxDepthReachedL = Math.max(maxDepthReachedL, dropL);
            maxDepthReachedR = Math.max(maxDepthReachedR, dropR);

            // Reopening requires BOTH eyes to return to open baseline (drop <= 0.08)
            // and pupil darkness to return close to base
            const eyesReopened = (dropL <= 0.08 && dropR <= 0.08) &&
                                 (pupilDeltaL <= 8 && pupilDeltaR <= 8);

            // Physical human blink timing: 100ms - 550ms
            if (closedDuration >= 100 && closedDuration <= 550 && eyesReopened) {
              // Ensure the closure actually reached a deep dip during this cycle
              if (maxDepthReachedL >= 0.22 && maxDepthReachedR >= 0.22) {
                blinkPhase = 0;
                lastBlinkTime = now;
                if (navigator.vibrate) { try { navigator.vibrate(40); } catch (_) {} }
                onBlinkRegistered();
              } else {
                blinkPhase = 0;
              }
            } else if (closedDuration > 600) {
              // Prolonged closure (squinting, looking down, asleep) -> reset without counting
              blinkPhase = 0;
            }
          }
        } catch (e) {
          console.warn('Blink detector error:', e);
        }
      }, 33);
    }

    function onBlinkRegistered() {
      state.blinksDetected++;
      if (state.blinksDetected === 1) {
        $('bp1').className = 'blink-pill active';
        $('bp1').innerHTML = SVGS.check + ' Blink 1';
        $('camSubline').textContent = '1 of 2 blinks detected! Please blink once more…';
      } else if (state.blinksDetected >= 2) {
        $('bp2').className = 'blink-pill active';
        $('bp2').innerHTML = SVGS.check + ' Blink 2';
        $('camHeadline').textContent = 'Blinks Detected! ✓';
        $('camSubline').textContent = 'Liveness challenge completed';
        if (state.blinkTimer) { clearInterval(state.blinkTimer); state.blinkTimer = null; }

        // Record metrics
        const blinkCh = state.challenges.find(c => c.type === 'eye_blink' || c.type === 'blink');
        if (blinkCh) {
          state.challengeMetrics[blinkCh.id] = { blink_count: 2, face_presence_ratio: 0.98 };
        }

        // Auto progress to Slide 6B (Spontaneous Phrase Challenge)
        setTimeout(launchPhraseChallenge, 700);
      }
    }

    /* ──────────── STEP 6B: Spontaneous Phrase Challenge (Real-Time Overlay) ──────────── */
    function launchPhraseChallenge() {
      state.camMode = 'phrase';

      const phraseCh = state.challenges.find(c => c.type === 'phrase');
      const phrasePrompt = phraseCh ? (phraseCh.prompt || '') : '';
      const phraseWords = (phraseCh && phraseCh.expected_words) ? phraseCh.expected_words.join(' ') : 'puzzle sunset';
      const phraseDigits = (phraseCh && (phraseCh.expected_digits || phraseCh.expected_code))
        ? (phraseCh.expected_digits || phraseCh.expected_code).split('').join(' ')
        : '7 9 5 5';
      const fullPhrase = `${phraseWords} ${phraseDigits}`.trim();

      // Show Real-Time Glass Phrase Overlay
      $('phraseDisplayText').textContent = fullPhrase || phrasePrompt || 'puzzle sunset 7 9 5 5';
      $('phraseGlassOverlay').classList.remove('hidden');

      $('camHeadline').textContent = 'Read the phrase clearly';
      $('camSubline').textContent = 'Speak out loud into your microphone';
      $('blinkStatusRow').classList.add('hidden');
      const sBtn = $('speakingDoneBtn');
      if (sBtn) {
        sBtn.classList.remove('hidden');
        sBtn.disabled = true;
        sBtn.innerHTML = `<span class="bp-dot" style="background:#EF4444"></span> Speaking… (4s)`;
        sBtn.style.boxShadow = 'none';
      }

      // Start audio recording
      startAudioRecording();
    }

    function startAudioRecording() {
      state.audioChunks = [];
      let audioStream = (state.mainStream && state.mainStream.getAudioTracks().length > 0)
        ? new MediaStream(state.mainStream.getAudioTracks())
        : null;

      if (!audioStream) {
        safeGetMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(s => {
          if (s) {
            audioStream = s;
            initAudioRecorder(audioStream);
          }
        });
      } else {
        initAudioRecorder(audioStream);
      }

      state.recSecs = 0;
      state.recTimer = setInterval(() => {
        state.recSecs++;
        const s = String(state.recSecs % 60).padStart(2, '0');
        const m = String(Math.floor(state.recSecs / 60)).padStart(2, '0');
        $('recTimerText').textContent = `REC  ${m}:${s}`;

        const btn = $('speakingDoneBtn');
        if (btn && state.camMode === 'phrase') {
          if (state.recSecs < 4) {
            btn.disabled = true;
            btn.innerHTML = `<span class="bp-dot" style="background:#EF4444"></span> Speaking… (${4 - state.recSecs}s)`;
          } else {
            btn.disabled = false;
            btn.innerHTML = `${SVGS.checkSuccess} I'm Done Speaking`;
            btn.style.boxShadow = '0 0 16px rgba(132, 204, 22, 0.6)';
          }
        }

        // Auto-finish after 10 seconds to give ample comfortable speaking time
        if (state.recSecs >= 10 && state.camMode === 'phrase') {
          finishPhraseChallenge();
        }
      }, 1000);
    }

    function initAudioRecorder(stream) {
      if (typeof MediaRecorder !== 'undefined' && stream) {
        try {
          const aMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          state.audioRec = aMime ? new MediaRecorder(stream, { mimeType: aMime, audioBitsPerSecond: 128000 }) : new MediaRecorder(stream);
          state.audioRec.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
          state.audioRec.start(200);
        } catch (ae) {
          console.warn('Audio recorder warning:', ae);
        }
      }
    }

    async function finishPhraseChallenge() {
      if (state.camMode !== 'phrase') return;
      if (state.recSecs < 4) {
        toast('Please speak the entire phrase clearly (minimum 4 seconds)', 'warn');
        return;
      }
      if (state.recTimer) { clearInterval(state.recTimer); state.recTimer = null; }

      // Record phrase metrics
      const phraseCh = state.challenges.find(c => c.type === 'phrase');
      if (phraseCh) {
        state.challengeMetrics[phraseCh.id] = { duration_s: state.recSecs, spoken_natural: true };
      }

      exitCameraMode();
      await submitAllAndProcess();
    }

    /* ──────────── STEP 7: Submit Pipeline & Render Evaluating Screen ──────────── */
    async function submitAllAndProcess() {
      renderProcessing();

      // Stop video recorder
      if (state.videoRec && state.videoRec.state !== 'inactive') {
        await new Promise(res => {
          state.videoRec.onstop = () => res();
          try { state.videoRec.stop(); } catch (e) { res(); }
        });
      }

      // Stop audio recorder
      if (state.audioRec && state.audioRec.state !== 'inactive') {
        await new Promise(res => {
          state.audioRec.onstop = () => res();
          try { state.audioRec.stop(); } catch (e) { res(); }
        });
      }

      // Stop camera tracks
      if (state.mainStream) {
        state.mainStream.getTracks().forEach(t => t.stop());
        state.mainStream = null;
      }

      // Upload Audio
      if (state.audioChunks.length > 0) {
        const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
        const fd = new FormData();
        fd.append('file', new File([audioBlob], 'challenge_audio.webm', { type: 'audio/webm' }));
        try { await api('POST', `/flow/${VID}/upload/challenge_audio`, fd, true); }
        catch (e) { console.warn('audio upload:', e); }
      }

      // Upload Video
      if (state.videoChunks && state.videoChunks.length > 0) {
        const vMime = state.videoRec ? (state.videoRec.mimeType || 'video/webm') : 'video/webm';
        const ext = vMime.includes('mp4') ? '.mp4' : '.webm';
        const videoBlob = new Blob(state.videoChunks, { type: vMime });
        if (videoBlob.size > 500) {
          const fd = new FormData();
          fd.append('file', new File([videoBlob], 'challenge_video' + ext, { type: vMime }));
          try { await api('POST', `/flow/${VID}/upload/challenge_video`, fd, true); }
          catch (e) { console.warn('video upload:', e); }
        }
      }

      // Submit challenge results
      const results = state.challenges.map(ch => ({ id: ch.id, metrics: state.challengeMetrics[ch.id] || {} }));
      try { await api('POST', `/flow/${VID}/challenges/result`, { results }); }
      catch (e) { console.warn('challenge result:', e); }

      // Trigger server evaluation
      try { await api('POST', `/flow/${VID}/submit`); }
      catch (e) { if (!e.message.includes('409')) console.warn('submit notice:', e); }

      // Poll authentic verdict
      pollAuthenticVerdict();
    }

    /* ──────────── Evaluating Session (Dynamic Progress Bar & Live Polling) ──────────── */
    function renderProcessing() {
      setStep(7);
      $('pageTitle').textContent = 'Evaluating Session';
      $('headerStatusBadge').className = 'status-badge badge-review';
      $('headerStatusBadge').textContent = 'Evaluating';

      const checks = [
        { id: 'c_id', icon: SVGS.clipboard, name: 'ID Details & Biometric Face Match', status: 'Cross-referencing face embedding…' },
        { id: 'c_deepfake', icon: SVGS.activity, name: 'Deepfake & Scene Integrity', status: 'Scanning 16 frames with ViT detector…' },
        { id: 'c_voice', icon: SVGS.mic, name: 'AI Voice & Speaker Verification', status: 'Analyzing audio for synthetic signals…' },
        { id: 'c_challenge', icon: SVGS.checkSuccess, name: 'Live Challenge Validation', status: 'Verifying eye blinks & spoken phrase…' },
        { id: 'c_gates', icon: SVGS.mail, name: 'Multi-Factor Identity Gates', status: 'Verified' },
      ];

      card.innerHTML = `
        <h2 class="section-headline">Evaluating session</h2>
        <p class="section-subtitle">Our neural verification pipeline is analyzing your biometric authenticity and security challenges.</p>
        
        <!-- Dynamic Progress Bar Interface -->
        <div class="eval-progress-container">
          <div class="eval-percentage-row">
            <span class="eval-percentage-val" id="evalPercent">15%</span>
            <span class="eval-status-pill" id="evalStatusPill">
              ${SVGS.spinner} <span id="evalStatusPillText">Analyzing</span>
            </span>
          </div>
          <div class="eval-progress-track">
            <div class="eval-progress-bar" id="evalProgressBar" style="width: 15%"></div>
          </div>
          <div class="eval-phase-caption" id="evalPhaseText">
            Cross-referencing face biometric with ID document…
          </div>
        </div>

        <div class="check-list">
          ${checks.map((c, i) => `
            <div class="check-item ${i === 4 ? 'ok' : 'evaluating'}" id="${c.id}">
              <span class="ci-icon">${c.icon}</span>
              <div class="ci-text">
                <div class="ci-name">${c.name}</div>
                <div class="ci-status" id="${c.id}_st">${c.status}</div>
              </div>
              <span class="ci-badge" id="${c.id}_bd">${i === 4 ? SVGS.checkSuccess : SVGS.spinner}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function updateEvalProgress(percent, phaseText, completedCheckIds) {
      const pBar = $('evalProgressBar');
      const pVal = $('evalPercent');
      const pText = $('evalPhaseText');
      if (pBar) pBar.style.width = Math.min(100, Math.max(0, percent)) + '%';
      if (pVal) pVal.textContent = Math.round(percent) + '%';
      if (pText && phaseText) pText.textContent = phaseText;

      if (completedCheckIds) {
        completedCheckIds.forEach(id => {
          const el = $(id);
          if (el && !el.classList.contains('ok')) {
            el.className = 'check-item ok';
            const st = $(id + '_st'); if (st) st.textContent = 'Verified ✓';
            const bd = $(id + '_bd'); if (bd) bd.innerHTML = SVGS.checkSuccess;
          }
        });
      }
    }

    function pollAuthenticVerdict() {
      let tries = 0;
      let curProgress = 15;

      const poll = setInterval(async () => {
        tries++;

        // Smoothly advance client-side progress across phases
        if (tries <= 5) {
          curProgress = Math.min(35, curProgress + 4);
          updateEvalProgress(curProgress, 'Cross-referencing face embedding with ID photo…');
        } else if (tries <= 14) {
          curProgress = Math.min(58, curProgress + 2.5);
          updateEvalProgress(curProgress, 'Scanning 16 frames with ViT neural deepfake detector…', ['c_id']);
        } else if (tries <= 28) {
          curProgress = Math.min(78, curProgress + 1.5);
          updateEvalProgress(curProgress, 'Analyzing audio clip for synthetic voice & lip-sync signals…', ['c_id', 'c_deepfake']);
        } else if (tries <= 50) {
          curProgress = Math.min(94, curProgress + 0.8);
          updateEvalProgress(curProgress, 'Validating spontaneous phrase cadence and eye-blink timing…', ['c_id', 'c_deepfake', 'c_voice']);
        } else {
          curProgress = Math.min(97, curProgress + 0.1);
          updateEvalProgress(curProgress, 'Finalizing compliance policy and cryptographic attestation…', ['c_id', 'c_deepfake', 'c_voice', 'c_challenge']);
        }

        try {
          const ctx = await api('GET', `/flow/${VID}/context`);
          if (ctx.decision || ['completed', 'needs_review', 'rejected_recommended'].includes(ctx.status) || ctx.final_decision) {
            clearInterval(poll);

            // Complete progress bar to 100%
            updateEvalProgress(100, 'Verification complete! Preparing summary…', ['c_id', 'c_deepfake', 'c_voice', 'c_challenge', 'c_gates']);
            const stPill = $('evalStatusPill');
            if (stPill) {
              stPill.style.background = '#DCFCE7';
              stPill.style.color = '#15803D';
              stPill.innerHTML = `${SVGS.checkSmall} Complete`;
            }

            // Both approved and needs_review are certified successes for applicant
            const outcome = ctx.final_decision || ctx.decision || (ctx.status === 'completed' ? 'approved' : ctx.status);
            setTimeout(() => showResult(outcome, ctx.reasons), 800);
          }
        } catch (_) {}

        // Timeout increased to 300 tries (6 minutes) so slow CPU model runs never time out
        if (tries > 300) {
          clearInterval(poll);
          toast('Verification taking longer than usual. Please check your connection or contact support.', 'warn');
        }
      }, 1200);
    }

    /* ──────────── Final Results Screen with Animated Green Tick Mark ──────────── */
    function showResult(status, reasons) {
      const isOk = status === 'approved' || status === 'completed';
      const isReview = status === 'needs_review';

      $('headerStatusBadge').className = 'status-badge ' + (isOk ? 'badge-verified' : (isReview ? 'badge-review' : 'badge-unverified'));
      $('headerStatusBadge').textContent = isOk ? 'Verified' : (isReview ? 'In Review' : 'Rejected');
      $('pageTitle').textContent = isOk ? 'Identity Verified' : (isReview ? 'Under Review' : 'Verification Failed');

      if (isOk) {
        card.innerHTML = `
          <!-- Prominent Animated Green Tick Mark Circle -->
          <div class="verified-ring-wrap">
            <svg class="verified-tick-svg" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>

          <div style="text-align:center">
            <h2 style="font-size:24px;font-weight:800;color:#15803D;letter-spacing:-0.3px">Identity Verified!</h2>
            <p style="font-size:14px;color:var(--text-sub);max-width:320px;margin:6px auto 0 auto;line-height:1.5">
              All biometric gates, live liveness challenges, and government ID checks passed successfully.
            </p>
          </div>

          <div style="background:var(--sf2);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:6px">
            <div style="display:flex;justify-content:space-between;font-size:13px">
              <span style="color:var(--muted)">Document Type</span>
              <b style="color:var(--text)">${esc(state.docType.toUpperCase())}</b>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px">
              <span style="color:var(--muted)">Biometric Channels</span>
              <b style="color:#15803D">Protected Hardware Match</b>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px">
              <span style="color:var(--muted)">Status</span>
              <b style="color:#15803D">Approved & Certified</b>
            </div>
          </div>

          <button class="btn btn-primary" onclick="finishAndReturnToApp()" style="margin-top:12px;height:50px;font-size:16px">
            Return to ApexPay
          </button>
        `;
      } else {
        card.innerHTML = `
          <div style="text-align:center;padding:16px 0">
            <div style="width:72px;height:72px;border-radius:50%;background:${isReview ? '#FEF3C7' : '#FEE2E2'};color:${isReview ? '#B45309' : '#DC2626'};display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                ${isReview ? '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' : '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'}
              </svg>
            </div>
            <h2 style="font-size:22px;font-weight:800;color:${isReview ? '#B45309' : '#DC2626'}">${isReview ? 'Under Manual Review' : 'Verification Unsuccessful'}</h2>
            <p style="font-size:13px;color:var(--muted);max-width:320px;margin:8px auto 0 auto;line-height:1.5">
              ${(reasons && reasons.length) ? reasons.join('; ') : (isReview ? 'Our compliance team is verifying your session. You will be notified shortly.' : 'Document details or facial biometric do not match.')}
            </p>
          </div>

          <button class="btn btn-primary" onclick="finishAndReturnToApp()" style="margin-top:12px">
            Done
          </button>
        `;
      }
    }

    function finishAndReturnToApp() {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.postMessage === 'function') {
          window.AndroidBridge.postMessage(JSON.stringify({ type: 'kyc.done', vid: VID, status: 'completed' }));
        }
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'kyc.done', vid: VID, status: 'completed' }, '*');
        }
      } catch (e) {
        console.warn(e);
      }
      toast('Verification complete! Redirecting…', 'ok');
    }

    function handleCancelClose() {
      if (confirm('Are you sure you want to exit identity verification?')) {
        finishAndReturnToApp();
      }
    }

    function showHelpModal() {
      alert('Identity Verification Help:\n\n1. Use clear, unexpired Indian ID documents (Aadhaar, PAN, Passport, Driving Licence, or Voter ID).\n2. Ensure your face is evenly lit with no glasses reflection or shadows.\n3. Blink naturally 2 times when prompted.\n4. Read the phrase clearly into the microphone.');
    }

    // Start with Details
    renderDetails();
  </script>
</body>
