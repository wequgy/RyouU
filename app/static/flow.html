<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Secure identity verification — RyouU" />
  <title>Identity Verification — RyouU</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --sf2: #F1F5F9;
      --border: #E2E8F0;
      --bd2: #CBD5E1;
      --accent: #2563EB;
      --a2: #4F46E5;
      --success: #059669;
      --warn: #D97706;
      --danger: #DC2626;
      --text: #0F172A;
      --sub: #334155;
      --muted: #64748B;
      --radius: 20px;
      --shadow: 0 4px 24px rgba(37, 99, 235, .08);
      --shadow2: 0 2px 8px rgba(0, 0, 0, .06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 480px;
      padding: 24px 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--a2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .25);
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Step pills ── */
    .steps-wrap {
      width: 100%;
      max-width: 480px;
      padding: 20px 24px 0;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .step-pill {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .step-pill::after {
      content: '';
      position: absolute;
      top: 11px;
      left: 55%;
      width: 90%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }

    .step-pill:last-child::after {
      display: none;
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      background: var(--border);
      color: var(--muted);
      z-index: 1;
      transition: background .3s, color .3s;
      position: relative;
    }

    .step-num.active {
      background: linear-gradient(135deg, var(--accent), var(--a2));
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .35);
    }

    .step-num.done {
      background: var(--success);
      color: #fff;
    }

    .step-lbl {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      letter-spacing: .3px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .step-lbl.active {
      color: var(--accent);
      font-weight: 700;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 480px;
      margin: 16px 24px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: var(--shadow);
    }

    /* ── Typography & Step Icons ── */
    .step-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(37, 99, 235, .1), rgba(79, 70, 229, .1));
      border: 1px solid rgba(37, 99, 235, .15);
      color: var(--accent);
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── Inputs ── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .field-input {
      width: 100%;
      background: var(--sf2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      padding: 13px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      font-family: 'Inter', sans-serif;
    }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      background: #FFFFFF;
    }

    .field-input::placeholder {
      color: var(--muted);
    }

    .field-row {
      display: flex;
      gap: 12px;
    }

    .field-row .field-group {
      flex: 1;
    }

    /* ── OTP ── */
    .otp-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .otp-row input {
      width: 46px;
      height: 56px;
      background: var(--sf2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      font-family: 'Inter', sans-serif;
    }

    .otp-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      background: #FFFFFF;
    }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--bd2);
      border-radius: 14px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
      background: var(--sf2);
    }

    .upload-zone:hover {
      border-color: var(--accent);
      background: rgba(37, 99, 235, .04);
    }

    .upload-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-zone .uz-icon {
      margin-bottom: 10px;
      color: var(--accent);
    }

    .upload-zone p {
      font-size: 13px;
      color: var(--muted);
    }

    .file-ok {
      font-size: 12px;
      color: var(--success);
      font-weight: 600;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Camera & Media ── */
    video,
    canvas {
      width: 100%;
      border-radius: 14px;
      background: #0F172A;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    #selfieVid {
      transform: scaleX(-1);
    }

    .face-oval-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 220px;
      border: 2px dashed rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      pointer-events: none;
    }

    canvas {
      display: none;
    }

    /* ── Recording badge ── */
    .rec-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(220, 38, 38, .08);
      border: 1px solid rgba(220, 38, 38, .25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      font-weight: 600;
    }

    .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    .rec-timer {
      margin-left: auto;
      font-size: 12px;
      color: var(--danger);
      font-weight: 600;
    }

    /* ── Challenge boxes ── */
    .challenge-box {
      background: var(--sf2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      transition: border-color .3s, background .3s;
    }

    .challenge-box.done-ch {
      border-color: var(--success);
      background: rgba(5, 150, 105, .05);
    }

    .ch-tag {
      display: inline-block;
      background: rgba(37, 99, 235, .1);
      color: var(--accent);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .challenge-box p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--sub);
    }

    /* ── Phrase ── */
    .phrase-code {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 12px;
      text-align: center;
      background: linear-gradient(135deg, var(--accent), var(--a2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 12px 0 6px;
    }

    /* ── Check list (processing) ── */
    .check-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--sf2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      transition: border-color .3s, background .3s;
    }

    .check-item.running {
      border-color: rgba(37, 99, 235, .35);
      background: #FFFFFF;
    }

    .check-item.ok {
      border-color: rgba(5, 150, 105, .35);
      background: rgba(5, 150, 105, .04);
    }

    .check-item.fail {
      border-color: rgba(220, 38, 38, .35);
      background: rgba(220, 38, 38, .04);
    }

    .ci-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(37, 99, 235, .08);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-item.ok .ci-icon {
      background: rgba(5, 150, 105, .1);
      color: var(--success);
    }

    .ci-text {
      flex: 1;
    }

    .ci-name {
      font-weight: 600;
      color: var(--text);
    }

    .ci-status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      font-family: 'Inter', sans-serif;
      letter-spacing: .1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--a2));
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, .28);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(37, 99, 235, .38);
    }

    .btn-secondary {
      background: var(--sf2);
      color: var(--sub);
      border: 1.5px solid var(--border);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #10B981);
      color: #fff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, .25);
    }

    .btn-danger {
      background: linear-gradient(135deg, #DC2626, #EF4444);
      color: #fff;
    }

    .btn-sm {
      width: auto;
      padding: 9px 18px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row .btn {
      flex: 1;
    }

    /* ── Info / warn boxes ── */
    .info-box {
      background: rgba(37, 99, 235, .07);
      border: 1px solid rgba(37, 99, 235, .2);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 13px;
      color: #1E40AF;
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .warn-box {
      background: rgba(217, 119, 6, .07);
      border: 1px solid rgba(217, 119, 6, .2);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 13px;
      color: var(--warn);
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .err-box {
      background: rgba(220, 38, 38, .07);
      border: 1px solid rgba(220, 38, 38, .2);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 13px;
      color: var(--danger);
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .success-box {
      background: rgba(5, 150, 105, .07);
      border: 1px solid rgba(5, 150, 105, .2);
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 13px;
      color: var(--success);
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    /* ── Result ── */
    .result-hero {
      text-align: center;
      padding: 16px 0 8px;
    }

    .result-emblem {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .result-emblem.completed {
      background: rgba(5, 150, 105, .12);
      border: 2px solid rgba(5, 150, 105, .35);
      color: var(--success);
    }

    .result-emblem.needs_review {
      background: rgba(217, 119, 6, .12);
      border: 2px solid rgba(217, 119, 6, .35);
      color: var(--warn);
    }

    .result-emblem.rejected_recommended {
      background: rgba(220, 38, 38, .12);
      border: 2px solid rgba(220, 38, 38, .35);
      color: var(--danger);
    }

    .result-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .result-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── Details card ── */
    .details-card {
      background: var(--sf2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .dl {
      color: var(--muted);
    }

    .dv {
      font-weight: 700;
      color: var(--text);
      font-family: monospace;
      font-size: 12px;
    }

    /* ── ID preview ── */
    #idPreviewBox img {
      width: 100%;
      max-height: 220px;
      border-radius: 12px;
      object-fit: contain;
      background: #F1F5F9;
      border: 1.5px solid var(--border);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: var(--text);
      color: #fff;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 500;
      transition: transform .3s ease;
      z-index: 1000;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.ok {
      background: var(--success);
    }

    .toast.err {
      background: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .mt {
      margin-top: 4px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Progress dot bar ── */
    .progress-bar-wrap {
      width: 100%;
      max-width: 480px;
      padding: 12px 24px 0;
    }

    .progress-bar-track {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--a2));
      border-radius: 2px;
      transition: width .5s cubic-bezier(.4, 0, .2, 1);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="m9 12 2 2 4-4" />
      </svg>
    </div>
    <div>
      <div class="logo-text">RyouU</div>
      <div class="logo-sub">Identity Verification</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="pbar" style="width:0%"></div>
    </div>
  </div>

  <!-- Step pills -->
  <div class="steps-wrap" id="stepsWrap">
    <div class="step-pill">
      <div class="step-num active" id="sn1">1</div>
      <div class="step-lbl active" id="sl1">Details</div>
    </div>
    <div class="step-pill">
      <div class="step-num" id="sn2">2</div>
      <div class="step-lbl" id="sl2">Email</div>
    </div>
    <div class="step-pill">
      <div class="step-num" id="sn3">3</div>
      <div class="step-lbl" id="sl3">Phone</div>
    </div>
    <div class="step-pill">
      <div class="step-num" id="sn4">4</div>
      <div class="step-lbl" id="sl4">ID Doc</div>
    </div>
    <div class="step-pill">
      <div class="step-num" id="sn5">5</div>
      <div class="step-lbl" id="sl5">Selfie</div>
    </div>
    <div class="step-pill">
      <div class="step-num" id="sn6">6</div>
      <div class="step-lbl" id="sl6">Liveness</div>
    </div>
    <div class="step-pill">
      <div class="step-num" id="sn7">7</div>
      <div class="step-lbl" id="sl7">Done</div>
    </div>
  </div>

  <!-- Main card -->
  <div class="card" id="card"></div>
  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    /* ──────────── SVG Icon Library (Zero Emojis) ──────────── */
    const SVGS = {
      check: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      checkSmall: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg>`,
      checkSuccess: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,

    };

    /* ──────────── Bootstrap ──────────── */
    const params = new URLSearchParams(location.search);
    const VID = params.get('v') || '';
    const TOKEN = params.get('t') || '';
    const API = (params.get('api') || (location.origin && location.origin !== 'null' ? location.origin : 'http://localhost:8000')).replace(/\/$/, '');
    const FH = { 'X-Flow-Token': TOKEN };
    const $ = id => document.getElementById(id);
    const card = $('card');

    // Pre-fill from SDK query params
    const PRE_NAME = params.get('name') || '';
    const PRE_EMAIL = params.get('email') || '';
    const PRE_PHONE = params.get('phone') || '';
    const PRE_DOB = params.get('dob') || '';
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* ──────────── State ──────────── */
    const state = {
      // Form
      name: PRE_NAME, dob: PRE_DOB, email: PRE_EMAIL,
      phone: PRE_PHONE,
      // Files
      idFile: null, selfieBlob: null,
      // Video recording
      mainStream: null, videoRec: null, videoChunks: [],
      videoBlob: null, recSecs: 0, recTimer: null,
      // Liveness
      headTurnDone: false, handWaveDone: false, voiceDone: false,
      challenges: [], challengeMetrics: {},
      // Signals
      focusLossCount: 0, cameraLabel: '', cameraSettings: {},
      // Camera
      idStream: null,
    };

    let phraseCh = null;
    let currentStep = 1;

    /* ──────────── Helpers ──────────── */
    function toast(msg, type = '', ms = 3500) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => el.className = 'toast', ms);
    }

    async function api(method, path, body, isForm = false) {
      const opts = { method, headers: { ...FH } };
      if (body && !isForm) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      if (body && isForm) { opts.body = body; }
      const r = await fetch(API + path, opts);
      if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(r.status + ': ' + t.slice(0, 140)); }
      return r.json().catch(() => ({}));
    }

    async function safeGetMedia(constraints) {
      try {
        if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
          return await navigator.mediaDevices.getUserMedia(constraints);
        }
      } catch (e) {
        console.warn('mediaDevices.getUserMedia warning:', e);
      }
      try {
        const legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
        if (legacy) {
          return await new Promise((res, rej) => legacy.call(navigator, constraints, res, rej));
        }
      } catch (e) {
        console.warn('legacy getUserMedia warning:', e);
      }
      return null;
    }

    function setStep(n) {
      currentStep = n;
      try {
        localStorage.setItem('kyc_step_' + VID, String(n));
        sessionStorage.setItem('kyc_step_' + VID, String(n));
      } catch (e) {}
      // Progress bar
      $('pbar').style.width = ((n - 1) / 6 * 100) + '%';
      // Pills
      for (let i = 1; i <= 7; i++) {
        const num = $('sn' + i), lbl = $('sl' + i);
        if (!num) continue;
        if (i < n) { num.className = 'step-num done'; num.innerHTML = SVGS.check; }
        else if (i === n) { num.className = 'step-num active'; num.textContent = i; lbl.className = 'step-lbl active'; }
        else { num.className = 'step-num'; num.textContent = i; lbl.className = 'step-lbl'; }
        if (i < n) lbl.className = 'step-lbl';
      }
    }

    function buildOtp(rowId, n) {
      const row = $(rowId); row.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const inp = document.createElement('input');
        inp.maxLength = 1; inp.inputMode = 'numeric';
        inp.addEventListener('input', () => { if (inp.value && i < n - 1) row.children[i + 1].focus(); });
        inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && i > 0) row.children[i - 1].focus(); });
        inp.addEventListener('paste', e => {
          e.preventDefault();
          const digits = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, n);
          for (let j = 0; j < digits.length; j++) { if (row.children[j]) row.children[j].value = digits[j]; }
          if (row.children[Math.min(digits.length, n) - 1]) row.children[Math.min(digits.length, n) - 1].focus();
        });
        row.appendChild(inp);
      }
    }
    function getOtp(rowId) { return Array.from($(rowId).children).map(i => i.value).join(''); }

    // Hardware media wrapper safe for mobile WebViews
    async function safeGetMedia(constraints) {
      if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
        try {
          return await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e) {
          console.warn('mediaDevices.getUserMedia failed:', e);
        }
      }
      const legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
      if (legacyGetUserMedia) {
        try {
          return await new Promise((res, rej) => legacyGetUserMedia.call(navigator, constraints, res, rej));
        } catch (e) {
          console.warn('legacy getUserMedia failed:', e);
        }
      }
      return null;
    }

    /* ──────────── STEP 1: Details ──────────── */
    function renderDetails() {
      setStep(1);
      card.innerHTML = `
    <div class="step-icon">${SVGS.clipboard}</div>
    <h2>Your Details</h2>
    <p class="subtitle">Enter your details exactly as shown on your government ID. We will verify your email and phone next, followed by your ID document.</p>

    <div class="field-group">
      <div class="field-label">Full Legal Name</div>
      <input class="field-input" id="fName" type="text" value="${esc(PRE_NAME)}" placeholder="e.g. Alex Morgan" autocomplete="name"/>
    </div>

    <div class="field-group">
      <div class="field-label">Date of Birth</div>
      <input class="field-input" id="fDob" type="text" value="${esc(PRE_DOB)}" placeholder="YYYY-MM-DD" maxlength="10"/>
    </div>

    <div class="field-group">
      <div class="field-label">Email Address</div>
      <input class="field-input" id="fEmail" type="email" value="${esc(PRE_EMAIL)}" placeholder="Verification code will arrive here" autocomplete="email"/>
    </div>

    <div class="field-group">
      <div class="field-label">Mobile Number</div>
      <input class="field-input" id="fPhone" type="tel" value="${esc(PRE_PHONE)}" placeholder="10-digit number e.g. 9876543210" autocomplete="tel"/>
    </div>

    <div id="detailsErr" class="err-box hidden">
      ${SVGS.alert}
      <span id="detailsErrMsg"></span>
    </div>

    <div class="info-box">
      ${SVGS.lock}
      <span>Your personal data is encrypted end-to-end and used strictly for identity verification.</span>
    </div>

    <button class="btn btn-primary" onclick="submitDetails()">Continue</button>`;
    }

    function submitDetails() {
      const name = $('fName').value.trim();
      const dob = $('fDob').value.trim();
      const email = $('fEmail').value.trim();
      const phone = $('fPhone').value.trim();

      const errEl = $('detailsErr'), errMsg = $('detailsErrMsg');
      const show = msg => { errMsg.textContent = msg; errEl.classList.remove('hidden'); };

      if (!name) return show('Please enter your full legal name.');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return show('Enter date of birth in YYYY-MM-DD format (e.g. 2000-01-15).');
      if (!email.includes('@')) return show('Enter a valid email address.');
      if (phone.replace(/\D/g, '').length < 10) return show('Enter a valid 10-digit mobile number.');

      errEl.classList.add('hidden');
      state.name = name; state.dob = dob;
      state.email = email; state.phone = phone;

      renderEmailOtp();
    }

    /* ──────────── STEP 2: Email OTP ──────────── */
    function renderEmailOtp() {
      setStep(2);
      card.innerHTML = `
    <div class="step-icon">${SVGS.mail}</div>
    <h2>Verify your email</h2>
    <p class="subtitle">A 6-digit code will be sent to <b>${esc(state.email)}</b>. Check your inbox and enter the code below.</p>

    <button class="btn btn-primary" id="sendEmailBtn" onclick="sendEmailOtp()">Send Verification Code</button>

    <div class="hidden" id="emailOtpBox">
      <div class="divider">Enter your 6-digit code</div>
      <div class="otp-row" id="emailOtpRow"></div>
      <button class="btn btn-primary" style="margin-top:18px" id="verifyEmailBtn" onclick="verifyEmailOtp()">Verify Email</button>
      <button class="btn btn-secondary btn-sm mt" style="margin-left:auto;display:block" onclick="sendEmailOtp()">Resend Code</button>
    </div>`;
      buildOtp('emailOtpRow', 6);
    }

    async function sendEmailOtp() {
      const btn = $('sendEmailBtn'); btn.disabled = true; btn.textContent = 'Sending…';
      try {
        await api('POST', `/flow/${VID}/otp/send`, { channel: 'email', destination: state.email });
        $('emailOtpBox').classList.remove('hidden');
        btn.textContent = 'Resend Code'; btn.disabled = false;
        toast('Verification code sent to your inbox', 'ok');
      } catch (e) {
        toast('Error sending email: ' + e.message, 'err');
        btn.disabled = false; btn.textContent = 'Send Verification Code';
      }
    }

    async function verifyEmailOtp() {
      const code = getOtp('emailOtpRow');
      if (code.length < 6) { toast('Please enter all 6 digits', 'err'); return; }
      const btn = $('verifyEmailBtn'); btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        await api('POST', `/flow/${VID}/otp/verify`, { channel: 'email', code });
        toast('Email verified successfully', 'ok');
        setTimeout(renderPhoneOtp, 600);
      } catch (e) {
        toast('Incorrect or expired code', 'err');
        btn.disabled = false; btn.textContent = 'Verify Email';
      }
    }

    /* ──────────── STEP 3: Phone OTP ──────────── */
    function renderPhoneOtp() {
      setStep(3);
      card.innerHTML = `
    <div class="step-icon">${SVGS.phone}</div>
    <h2>Verify your phone</h2>
    <p class="subtitle">A 6-digit code will be sent to <b>${esc(state.phone)}</b>. If SMS delivery is delayed, we automatically deliver the code to your verified email.</p>

    <button class="btn btn-primary" id="sendPhoneBtn" onclick="sendPhoneOtp()">Send Phone Code</button>

    <div class="hidden" id="phoneOtpBox">
      <div class="divider">Enter your 6-digit code</div>
      <div class="info-box">
        ${SVGS.mailSmall}
        <span>Didn't receive SMS? Check <b>${esc(state.email)}</b> — your code is also delivered there.</span>
      </div>
      <div class="otp-row" id="phoneOtpRow" style="margin-top:14px"></div>
      <button class="btn btn-primary" style="margin-top:18px" id="verifyPhoneBtn" onclick="verifyPhoneOtp()">Verify Phone</button>
      <button class="btn btn-secondary btn-sm mt" style="margin-left:auto;display:block" onclick="sendPhoneOtp()">Resend</button>
    </div>`;
      buildOtp('phoneOtpRow', 6);
    }

    async function sendPhoneOtp() {
      const btn = $('sendPhoneBtn'); btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await api('POST', `/flow/${VID}/otp/send`, { channel: 'phone', destination: state.phone });
        $('phoneOtpBox').classList.remove('hidden');
        btn.textContent = 'Resend Code'; btn.disabled = false;
        if (res.fallback === 'email') {
          toast('Phone code delivered directly to your email inbox', 'ok', 6000);
          const noticeBox = document.querySelector('#phoneOtpBox .info-box');
          if (noticeBox) {
            noticeBox.innerHTML = `${SVGS.mailSmall}<span><b>SMS gateway requires commercial deposit.</b><br/>Your phone OTP was sent directly to: <b>${res.email || state.email}</b>.` +
              (res.dev_code ? `<br/><span style="display:inline-block;margin-top:6px;font-weight:800;color:var(--accent);background:rgba(37,99,235,0.1);padding:3px 10px;border-radius:6px">Code: ${res.dev_code}</span>` : '') + `</span>`;
          }
        } else {
          toast('Verification code sent', 'ok');
          if (res.dev_code) {
            const noticeBox = document.querySelector('#phoneOtpBox .info-box');
            if (noticeBox) {
              noticeBox.innerHTML += `<br/><span style="display:inline-block;margin-top:6px;font-weight:800;color:var(--accent);background:rgba(37,99,235,0.1);padding:3px 10px;border-radius:6px">Code: ${res.dev_code}</span>`;
            }
          }
        }
      } catch (e) {
        toast('Error sending code: ' + e.message, 'err');
        btn.disabled = false; btn.textContent = 'Send Phone Code';
      }
    }

    async function verifyPhoneOtp() {
      const code = getOtp('phoneOtpRow');
      if (code.length < 6) { toast('Please enter all 6 digits', 'err'); return; }
      const btn = $('verifyPhoneBtn'); btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        await api('POST', `/flow/${VID}/otp/verify`, { channel: 'phone', code });
        toast('Phone verified successfully', 'ok');
        setTimeout(renderIdUpload, 600);
      } catch (e) {
        toast('Incorrect or expired code', 'err');
        btn.disabled = false; btn.textContent = 'Verify Phone';
      }
    }

    /* ──────────── STEP 4: ID Upload ──────────── */
    function renderIdUpload() {
      setStep(4);
      card.innerHTML = `
    <div class="step-icon">${SVGS.idCard}</div>
    <h2>Upload your ID</h2>
    <p class="subtitle">Submit a clear photo of your government-issued ID — Aadhaar, PAN, Passport, or Driving Licence.</p>

    <div id="idGateError" class="hidden"></div>

    <!-- File picker -->
    <div id="idFileMode">
      <div class="upload-zone" style="position:relative;cursor:pointer">
        <input type="file" id="idInput" accept="image/*" capture="environment" onchange="onIdFile(this)" style="position:absolute;inset:0;opacity:0.001;width:100%;height:100%;cursor:pointer;z-index:10;display:block"/>
        <div class="uz-icon">${SVGS.fileUpload}</div>
        <p><b>Tap to open camera and take ID photo</b></p>

      </div>

      <div class="btn-row" style="margin-top:12px">
        <div class="btn btn-primary" style="position:relative;cursor:pointer;overflow:hidden">
          <input type="file" id="idCamBtnInput" accept="image/*" capture="environment" onchange="onIdFile(this)" style="position:absolute;inset:0;opacity:0.001;width:100%;height:100%;cursor:pointer;z-index:10;display:block"/>
          ${SVGS.camera} Camera
        </div>
        <div class="btn btn-secondary" style="position:relative;cursor:pointer;overflow:hidden">
          <input type="file" id="idGalleryBtnInput" accept="image/*" onchange="onIdFile(this)" style="position:absolute;inset:0;opacity:0.001;width:100%;height:100%;cursor:pointer;z-index:10;display:block"/>
          ${SVGS.folder} Gallery
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div id="idPreviewBox" class="hidden">
      <img id="idPreviewImg"/>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span class="file-ok" id="idPreviewLbl">${SVGS.checkSmall} Document ready</span>
        <button class="btn btn-secondary btn-sm" onclick="resetId()">
          ${SVGS.refresh} Change
        </button>
      </div>
      <button class="btn btn-primary" id="idNextBtn" style="margin-top:14px" onclick="uploadId()">Verify ID Details</button>
    </div>

    <div class="info-box">
      ${SVGS.info}
      <span>All four corners must be visible. Face photo and details on the card must be clear and legible.</span>
    </div>`;
    }

    function onIdFile(inp) {
      if (!inp.files?.[0]) return;

      // Attach camera to live liveness viewfinder

          lvid.play().catch(e => console.warn(e));

    function doneAction(id) {

        }

      checkReady();
    }
    const doneHead = doneAction;

    function checkReady() {
      if ((state.actionDone || state.headTurnDone) && state.voiceDone) {
        $('submitBtn').classList.remove('hidden');
      }
    }

    let micRec = null, micChunks = [];
    async function startMic() {
      try {
        let recStream = state.mainStream;
        if (!recStream || recStream.getTracks().length === 0) {
          recStream = await safeGetMedia({ video: { facingMode: { ideal: 'user' } }, audio: true })
            || await safeGetMedia({ audio: true });
          if (recStream) state.mainStream = recStream;
        }

        const lvid = $('livenessVid');
        if (lvid && recStream) {
          lvid.srcObject = recStream;
          lvid.play().catch(e => console.warn(e));
        }

        // Show REC badge
        const badge = $('livenessRecBadge');
        if (badge) badge.classList.remove('hidden');

        // Start video+audio recorder for synchronized lip-sync and deepfake checks
        state.videoChunks = [];
        if (typeof MediaRecorder !== 'undefined' && recStream) {
          try {
            const vMime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
            state.videoRec = vMime ? new MediaRecorder(recStream, { mimeType: vMime }) : new MediaRecorder(recStream);
            state.videoRec.ondataavailable = e => { if (e.data.size > 0) state.videoChunks.push(e.data); };
            state.videoRec.start(250);
          } catch (ve) {
            console.warn('Video recorder start failed, falling back:', ve);
          }
        }

      const badge = $('livenessRecBadge');
      if (badge) badge.classList.add('hidden');
      if (state.videoRec && state.videoRec.state !== 'inactive') {
        try { state.videoRec.stop(); } catch (e) {}
      }
      if (micRec && micRec.state !== 'inactive') {
        try { micRec.stop(); } catch (e) {}

    async function submitAll() {

      if (state.videoRec && state.videoRec.state !== 'inactive') {
        await new Promise(res => {
          state.videoRec.onstop = () => res();
          try { state.videoRec.stop(); } catch (e) { res(); }
        });
      }
      if (micRec && micRec.state !== 'inactive') {
        await new Promise(res => {
          micRec.onstop = () => res();
          try { micRec.stop(); } catch (e) { res(); }
        });
      }

      // Stop media tracks
      if (state.mainStream) state.mainStream.getTracks().forEach(t => t.stop());

      // 2. Upload voice audio
      if (micChunks.length > 0) {
        const voiceBlob = new Blob(micChunks, { type: 'audio/webm' });

        fd.append('file', new File([voiceBlob], 'challenge_audio.webm', { type: 'audio/webm' }));

      if (state.videoChunks && state.videoChunks.length > 0) {
        const vMime = state.videoRec ? (state.videoRec.mimeType || 'video/webm') : 'video/webm';
        const ext = vMime.includes('mp4') ? '.mp4' : '.webm';
        const videoBlob = new Blob(state.videoChunks, { type: vMime });
        if (videoBlob.size > 1000) {
          const fd = new FormData();
          fd.append('file', new File([videoBlob], 'challenge_video' + ext, { type: vMime }));
          try { await api('POST', `/flow/${VID}/upload/challenge_video`, fd, true); }
          catch (e) { console.warn('Video upload notice:', e.message); }

      const results = state.challenges.map(ch => ({ id: ch.id, metrics: state.challengeMetrics[ch.id] || {} }));

        } catch (_) { }

      }, 1500);

      <div class="detail-row"><span class="dl">Name</span><span class="dv">${esc(state.name) || '—'}</span></div>
      <div class="detail-row"><span class="dl">Modules Evaluated</span><span class="dv">7 AI Checks</span></div>
    </div>

    <div class="info-box">
      ${SVGS.lock}
      <span>Your verification record has been securely transmitted back to the fintech engine.</span>
    </div>

    <button class="btn btn-primary" onclick="notifyApp('${status}')">Return to ApexPay</button>`;

      notifyApp(status);
    }

    function notifyApp(status) {
      const msgObj = { type: 'kyc.done', vid: VID, status };
      const payload = JSON.stringify(msgObj);
      if (window.AndroidBridge && typeof window.AndroidBridge.postMessage === 'function') {
        window.AndroidBridge.postMessage(payload);
      }
      if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
        window.ReactNativeWebView.postMessage(payload);
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msgObj, '*');
        window.parent.postMessage(payload, '*');
      }
      location.hash = 'kyc.done:' + VID;
    }

    /* ──────────── Security signals ──────────── */
    document.addEventListener('visibilitychange', () => { if (document.hidden) state.focusLossCount++; });
    window.addEventListener('blur', () => state.focusLossCount++);

    function openExternalBrowser(url) {
      if (url) window.open(url, '_blank');
    }

    /* ──────────── Expose onclick handlers ──────────── */
    Object.assign(window, {
      submitDetails, sendEmailOtp, verifyEmailOtp, sendPhoneOtp, verifyPhoneOtp,
      onIdFile, resetId, uploadId,
      captureSelfie, retakeSelfie, startMainSession, openExternalBrowser,
      goLiveness, doneHead, doneAction, startMic, stopMic,
      submitAll, notifyApp,
    });

    /* ──────────── Boot ──────────── */
    async function bootFlow() {
      if (!VID || !TOKEN) {
        card.innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div class="result-emblem needs_review" style="margin-bottom:20px">
          ${SVGS.linkOff}
        </div>
        <h2>Invalid Session</h2>
        <p class="subtitle" style="margin-top:10px">Please open this verification session directly from the ApexPay app.</p>
      </div>`;
        return;
      }

      // Check server session state first for 100% accurate resumption
      try {
        const ctx = await api('GET', `/flow/${VID}/context`);
        if (['completed', 'needs_review', 'rejected_recommended'].includes(ctx.status)) {
          showResult(ctx.status);
          return;
        }

        const uploaded = ctx.uploaded || [];
        const verified = ctx.verified || [];
        const gates = ctx.gates || {};

        if (gates.selfie?.passed || uploaded.includes('selfie')) {
          renderLiveness();
          return;
        }
        if (gates.id_image?.passed || uploaded.includes('id_image')) {
          renderSelfie();
          return;
        }
        if (verified.includes('phone')) {
          renderIdUpload();
          return;
        }
        if (verified.includes('email')) {
          renderPhoneOtp();
          return;
        }
      } catch (err) {
        console.warn('Context boot fetch error:', err);
      }

      // Fallback to localStorage (persistent across WebView restarts)
      const savedStep = parseInt(localStorage.getItem('kyc_step_' + VID) || sessionStorage.getItem('kyc_step_' + VID) || '1', 10);
      if (savedStep >= 6) renderLiveness();
      else if (savedStep === 5) renderSelfie();
      else if (savedStep === 4) renderIdUpload();
      else if (savedStep === 3) renderPhoneOtp();
      else if (savedStep === 2) renderEmailOtp();
      else renderDetails();
    }

    bootFlow();
  </script>
</body>

</html>
